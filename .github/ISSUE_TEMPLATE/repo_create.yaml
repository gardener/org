name: Repository creation
description: Create a repository into the Gardener Org
labels: [ "kind/task" ]
title: "Repository creation request for <github repo>"
body:
- id: repo_name
  type: input
  attributes:
    label: Requested name for new repository
    placeholder: e.g. gardener-foo
  validations:
    required: true
- id: visibility
  type: dropdown
  attributes:
    label: What should be the repo visibility?
    description: >
      Repositories in the Gardener organization are public by default. Private repositories
      are an exception and require a justification below.
    multiple: false
    options:
    - "public"
    - "private (requires justification)"
  validations:
    required: true
- id: private_justification
  type: textarea
  attributes:
    label: Justification for private visibility
    description: >
      Required if private visibility was selected above. Explain why public visibility is not
      suitable (e.g. sensitive data, embargoed security work, contractual obligation).
    placeholder: |
      Why must this repository be private?
      Is there a plan to make it public in the future?
  validations:
    required: false
- id: repo_type
  type: dropdown
  attributes:
    label: What type of repository is this?
    description: >
      The type determines additional requirements. New Gardener extensions introduced into
      the official GitHub organization require a Gardener Enhancement Proposal (GEP) to be
      approved by the Technical Steering Committee (TSC) before the repository can be created.
      See https://gardener.cloud/community/steering/#key-considerations-for-topics for details.
    multiple: false
    options:
    - "Gardener extension (requires approved GEP)"
    - "Controller manager / operator"
    - "Tool / utility"
    - "Other"
  validations:
    required: true
- id: gep_link
  type: input
  attributes:
    label: Link to approved GEP (required for Gardener extensions)
    description: >
      If this repository is for a new Gardener extension, provide the link to the approved GEP issue
      in the gardener/enhancements repository. The GEP must be approved by the TSC before the
      repository will be created. Leave blank for non-extension repositories.
    placeholder: "e.g. https://github.com/gardener/enhancements/issue/123"
  validations:
    required: false
- id: owners
  type: input
  attributes:
    label: Who should be listed as approvers in OWNERS/OWNERS_ALIASES?
    placeholder: e.g. alice, bob
  validations:
    required: true
- id: description
  type: textarea
  attributes:
    description: >
      Describe what this repository is for, what problem it solves, and how it fits into
      the Gardener ecosystem. This should be sufficient for maintainers and sponsors to
      evaluate the request.
    label: What should the repo description be?
    placeholder: |
      - What does this repository do?
      - Why is a new repository needed (vs. contributing to an existing one)?
      - Who are the intended users or consumers?
  validations:
    required: true
- id: sponsors
  type: textarea
  attributes:
    label: Please provide GitHub handle of repository sponsors
    description: >
      Sponsors are existing Gardener org members who vouch for the repository and its maintainers.
      This issue will not be processed until at least one listed sponsor has confirmed their support
      by commenting on this issue.
    placeholder: e.g. @alice, @bob
  validations:
    required: true
- id: context
  type: textarea
  attributes:
    label: Additional context for request
    placeholder: Any additional information or context to describe the request.
  validations:
    required: false
